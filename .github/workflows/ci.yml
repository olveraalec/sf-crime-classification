name: CI/CD Pipeline

on:
  push:
    branches:
      - version-3-api-deployment
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =====================================================
  # Job 1: Python unit, integration, and API tests
  # =====================================================
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.12.1"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Display environment
        run: |
          uv run python --version
          uv --version

      - name: Run test suite
        run: uv run pytest -q

  # =====================================================
  # Job 2: Build and smoke-test the complete container
  # =====================================================
  docker-runtime:
    name: Docker runtime smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - python-tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download versioned model artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/models

          gh release download model-artifacts-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --dir artifacts/models \
            --clobber

      - name: Verify model artifact checksums
        working-directory: artifacts/models
        run: |
          echo "Downloaded model artifacts:"
          ls -lh

          sha256sum --check SHA256SUMS

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build complete runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: sf-crime-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start API container
        run: |
          docker run \
            --detach \
            --rm \
            --name sf-crime-api-ci \
            --publish 8000:8000 \
            sf-crime-api:ci

      - name: Wait for prediction readiness
        run: |
          ready=false

          for attempt in $(seq 1 30); do
            echo "Readiness attempt ${attempt}/30"

            if curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:8000/health/ready \
              > readiness.json; then
              ready=true
              break
            fi

            if ! docker inspect sf-crime-api-ci > /dev/null 2>&1; then
              echo "Container stopped before becoming ready."
              exit 1
            fi

            sleep 2
          done

          if [ "$ready" != "true" ]; then
            echo "API did not become ready within 60 seconds."
            exit 1
          fi

          echo "Readiness response:"
          cat readiness.json

          python3 - <<'PY'
          import json

          with open("readiness.json", encoding="utf-8") as file:
              body = json.load(file)

          assert body["status"] == "ready"
          assert body["ready"] is True
          assert all(body["checks"].values())

          print("Readiness response validated.")
          PY

      - name: Validate model information
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:8000/model/info \
            > model-info.json

          echo "Model information response:"
          cat model-info.json

          python3 - <<'PY'
          import json

          with open("model-info.json", encoding="utf-8") as file:
              body = json.load(file)

          assert body["model_name"] == "xgboost_finalist"
          assert body["class_count"] > 0
          assert body["raw_feature_columns"] > 0
          assert body["transformed_feature_columns"] > 0

          print("Model information response validated.")
          PY

      - name: Test real prediction
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{
              "incident": {
                "incident_timestamp": "2015-05-13T23:53:00",
                "pd_district": "NORTHERN",
                "address": "OAK ST / LAGUNA ST",
                "longitude": -122.425892,
                "latitude": 37.774599
              },
              "top_k": 3
            }' \
            http://127.0.0.1:8000/predictions \
            > prediction.json

          echo "Prediction response:"
          cat prediction.json

          python3 - <<'PY'
          import json

          with open("prediction.json", encoding="utf-8") as file:
              body = json.load(file)

          assert body["input_position"] == 0
          assert isinstance(body["predicted_class"], str)
          assert body["predicted_class"]
          assert 0.0 <= body["predicted_probability"] <= 1.0
          assert len(body["top_predictions"]) == 3
          assert body["inference_time_ms"] >= 0.0

          for expected_rank, prediction in enumerate(
              body["top_predictions"],
              start=1,
          ):
              assert prediction["rank"] == expected_rank
              assert prediction["crime_category"]
              assert 0.0 <= prediction["probability"] <= 1.0

          print("Real prediction response validated.")
          PY

      - name: Show container logs
        if: ${{ always() }}
        run: |
          echo "Container logs:"
          docker logs sf-crime-api-ci || true

      - name: Stop API container
        if: ${{ always() }}
        run: |
          docker stop sf-crime-api-ci || true

  # =====================================================
  # Job 3: Publish the image and deploy it to EC2
  # =====================================================
  deploy:
    name: Deploy production container
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs:
      - python-tests
      - docker-runtime

    # Never deploy pull requests. Deployment is permitted only from the
    # branches included in the AWS OIDC trust policy.
    if: >-
      github.event_name != 'pull_request' &&
      (
        github.ref == 'refs/heads/version-3-api-deployment' ||
        github.ref == 'refs/heads/main'
      )

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.AWS_EC2_INSTANCE_ID }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: sf-crime-github-deployment

      - name: Confirm AWS deployment identity
        run: |
          aws sts get-caller-identity
          echo "Deploying commit: $GITHUB_SHA"
          echo "AWS region: $AWS_REGION"
          echo "ECR repository: $ECR_REPOSITORY"
          echo "EC2 instance: $EC2_INSTANCE_ID"

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Define immutable image URI
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"
          echo "Production image: ${IMAGE_URI}"

      # The ECR repository uses immutable tags. A manual rerun for the same
      # commit must reuse the existing image instead of attempting to push
      # the same SHA tag again.
      - name: Check whether commit image already exists
        id: image-check
        run: |
          if aws ecr describe-images \
            --region "$AWS_REGION" \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image already exists for commit $IMAGE_TAG."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "A new image will be built and pushed."
          fi

      - name: Download versioned model artifacts
        if: steps.image-check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/models

          gh release download model-artifacts-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --dir artifacts/models \
            --clobber

      - name: Verify model artifact checksums
        if: steps.image-check.outputs.exists != 'true'
        working-directory: artifacts/models
        run: |
          ls -lh
          sha256sum --check SHA256SUMS

      - name: Set up Docker Buildx
        if: steps.image-check.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push immutable production image
        if: steps.image-check.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ vars.AWS_ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Confirm image is available in ECR
        run: |
          aws ecr describe-images \
            --region "$AWS_REGION" \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query "imageDetails[0].{
              Digest:imageDigest,
              PushedAt:imagePushedAt,
              SizeBytes:imageSizeInBytes,
              Tags:imageTags
            }" \
            --output table

      - name: Prepare EC2 deployment script
        run: |
          test -f scripts/deploy_ec2.sh
          bash -n scripts/deploy_ec2.sh

          sed \
            -e "s|__AWS_REGION__|${AWS_REGION}|g" \
            -e "s|__IMAGE_URI__|${IMAGE_URI}|g" \
            scripts/deploy_ec2.sh \
            > /tmp/deploy-sf-crime.sh

          if grep -qE '__AWS_REGION__|__IMAGE_URI__' /tmp/deploy-sf-crime.sh; then
            echo "Deployment script still contains unresolved placeholders."
            exit 1
          fi

          bash -n /tmp/deploy-sf-crime.sh
          chmod 700 /tmp/deploy-sf-crime.sh

          echo "Prepared deployment script for:"
          echo "$IMAGE_URI"

      - name: Create Systems Manager parameters
        run: |
          python3 - <<'PY'
          import base64
          import json
          from pathlib import Path

          script_path = Path("/tmp/deploy-sf-crime.sh")
          encoded_script = base64.b64encode(
              script_path.read_bytes()
          ).decode("ascii")

          commands = [
              (
                  "echo "
                  f"'{encoded_script}' "
                  "| base64 --decode "
                  "> /tmp/deploy-sf-crime.sh"
              ),
              "chmod 700 /tmp/deploy-sf-crime.sh",
              "/tmp/deploy-sf-crime.sh",
              "rm -f /tmp/deploy-sf-crime.sh",
          ]

          parameters = {
              "commands": commands,
              "executionTimeout": ["900"],
          }

          Path("ssm-deployment-parameters.json").write_text(
              json.dumps(parameters),
              encoding="utf-8",
          )
          PY

      - name: Send deployment through Systems Manager
        id: send-deployment
        run: |
          COMMAND_ID="$(
            aws ssm send-command \
              --region "$AWS_REGION" \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy SF Crime image ${IMAGE_TAG}" \
              --timeout-seconds 900 \
              --parameters file://ssm-deployment-parameters.json \
              --query "Command.CommandId" \
              --output text
          )"

          echo "command-id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command ID: $COMMAND_ID"

      - name: Wait for EC2 deployment
        env:
          COMMAND_ID: ${{ steps.send-deployment.outputs.command-id }}
        run: |
          terminal_status=""

          for attempt in $(seq 1 120); do
            status="$(
              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query "Status" \
                --output text \
                2>/dev/null \
                || true
            )"

            echo "Deployment attempt ${attempt}/120: ${status:-not-yet-available}"

            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                terminal_status="$status"
                break
                ;;
            esac

            sleep 5
          done

          if [ -z "$terminal_status" ]; then
            echo "Deployment did not finish within ten minutes."
            exit 1
          fi

          echo "Final deployment status: $terminal_status"

          if [ "$terminal_status" != "Success" ]; then
            exit 1
          fi

      - name: Display EC2 deployment output
        if: ${{ always() }}
        env:
          COMMAND_ID: ${{ steps.send-deployment.outputs.command-id }}
        run: |
          if [ -z "${COMMAND_ID:-}" ]; then
            echo "No SSM deployment command was created."
            exit 0
          fi

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "{
              Status:Status,
              ResponseCode:ResponseCode,
              StandardOutput:StandardOutputContent,
              StandardError:StandardErrorContent
            }" \
            --output json \
            || true

      - name: Confirm deployed container through SSM
        if: ${{ success() }}
        run: |
          VERIFY_COMMAND_ID="$(
            aws ssm send-command \
              --region "$AWS_REGION" \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "Verify SF Crime deployment ${IMAGE_TAG}" \
              --timeout-seconds 300 \
              --parameters 'commands=[
                "set -euo pipefail",
                "docker inspect --format={{.Config.Image}} sf-crime-api",
                "docker inspect --format={{.State.Health.Status}} sf-crime-api",
                "curl --connect-timeout 3 --max-time 10 --fail --silent --show-error http://127.0.0.1:8000/health/live",
                "curl --connect-timeout 3 --max-time 10 --fail --silent --show-error http://127.0.0.1:8000/health/ready",
                "curl --connect-timeout 3 --max-time 10 --fail --silent --show-error http://127.0.0.1:8000/model/info"
              ]' \
              --query "Command.CommandId" \
              --output text
          )"

          echo "Verification command ID: $VERIFY_COMMAND_ID"
          terminal_status=""

          for attempt in $(seq 1 60); do
            status="$(
              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$VERIFY_COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query "Status" \
                --output text \
                2>/dev/null \
                || true
            )"

            echo "Verification attempt ${attempt}/60: ${status:-pending}"

            case "$status" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                terminal_status="$status"
                break
                ;;
            esac

            sleep 2
          done

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$VERIFY_COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "{
              Status:Status,
              ResponseCode:ResponseCode,
              StandardOutput:StandardOutputContent,
              StandardError:StandardErrorContent
            }" \
            --output json \
            || true

          if [ "$terminal_status" != "Success" ]; then
            echo "Post-deployment verification failed."
            exit 1
          fi

      - name: Verify public HTTPS service
        if: ${{ success() }}
        env:
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          if [ -z "$PRODUCTION_API_URL" ]; then
            echo "Repository variable PRODUCTION_API_URL is not configured."
            exit 1
          fi

          echo "Testing public production endpoint: $PRODUCTION_API_URL"

          curl \
            --connect-timeout 5 \
            --max-time 20 \
            --fail \
            --silent \
            --show-error \
            "${PRODUCTION_API_URL}/health/live"

          echo

          curl \
            --connect-timeout 5 \
            --max-time 20 \
            --fail \
            --silent \
            --show-error \
            "${PRODUCTION_API_URL}/health/ready"

          echo

          curl \
            --connect-timeout 5 \
            --max-time 20 \
            --fail \
            --silent \
            --show-error \
            "${PRODUCTION_API_URL}/model/info"

          echo
          echo "Public HTTPS deployment verified."