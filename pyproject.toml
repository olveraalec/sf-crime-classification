[project]
name = "sf-crime-classification"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.4",
    "fastapi>=0.140.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "shap>=0.51.0",
    "uvicorn>=0.51.0",
    "xgboost>=3.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
]
