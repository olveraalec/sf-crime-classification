[project]
name = "sf-crime-classification"
version = "3.0.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb>=1.5.4",
    "fastapi>=0.140.0",
    "joblib>=1.5.3",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "uvicorn[standard]>=0.51.0",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

analysis = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.0",
    "seaborn>=0.13.2",
    "shap>=0.51.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]